<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do Quiz</title>
<link rel="icon" href="img/logo-colegio.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2350;--blue:#1d4fa3;--sky:#e8f0fb;
    --gold:#c9a24a;--gold-light:#f3e6c2;--gold-dark:#9a7726;
    --white:#fff;--paper:#fbfaf6;--ink:#1b2440;--muted:#55607a;
    --radius:18px;--shadow:0 10px 30px rgba(15,35,80,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
  h1,h2{font-family:"Cinzel",Georgia,serif}
  header{background:var(--navy);color:var(--white);padding:18px 16px;border-bottom:4px solid var(--gold)}
  header .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px}
  header img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
  header h1{font-size:clamp(1.1rem,4vw,1.5rem);color:var(--gold-light)}
  header p{font-size:.85rem;color:#c9d3ea}
  header a{margin-left:auto;color:var(--gold-light);font-weight:700;font-size:.9rem;text-decoration:none;white-space:nowrap}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
  [hidden]{display:none!important}

  .login{max-width:400px;margin:40px auto;background:var(--white);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px 22px;border-top:5px solid var(--gold)}
  .login h2{color:var(--navy);margin-bottom:6px}
  .login p{color:var(--muted);margin-bottom:16px;font-size:.95rem}
  input{width:100%;padding:13px 15px;border-radius:12px;border:2px solid #c8d2e6;font:600 1rem "Nunito",sans-serif}
  input:focus{outline:none;border-color:var(--blue)}
  .btn{padding:12px 18px;border:0;border-radius:999px;cursor:pointer;font:800 .95rem "Nunito",sans-serif;
    background:var(--navy);color:var(--gold-light)}
  .btn:hover{background:var(--blue)}
  .btn.light{background:var(--white);color:var(--navy);border:2px solid var(--gold)}
  .btn.light:hover{background:var(--gold-light)}
  .login .btn{width:100%;margin-top:14px}
  .msg{margin-top:10px;font-weight:700;font-size:.9rem;min-height:1.2em;color:#b8423a}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;border-left:5px solid var(--gold)}
  .stat span{display:block;color:var(--muted);font-weight:700;font-size:.85rem}
  .stat strong{font-family:"Cinzel",serif;font-size:1.9rem;color:var(--navy)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input{flex:1 1 220px;width:auto}
  .seg{display:flex;background:var(--white);border:2px solid #c8d2e6;border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;
    font:800 .85rem "Nunito",sans-serif;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--navy);color:var(--gold-light)}
  .updated{color:var(--muted);font-size:.85rem;margin-bottom:10px}

  .table-wrap{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f6}
  th{background:var(--sky);color:var(--navy);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
  td.pos{font-weight:800;color:var(--gold-dark);width:56px}
  td.name{font-weight:700}
  td.date{color:var(--muted);font-size:.88rem;white-space:nowrap}
  .score{display:inline-block;min-width:64px;text-align:center;font-weight:800;padding:4px 10px;border-radius:999px;
    background:var(--sky);color:var(--blue)}
  .score.max{background:var(--gold);color:var(--navy)}
  .empty{padding:32px;text-align:center;color:var(--muted)}

  @media (max-width:600px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid #edf0f6}
    td{padding:0;border:0}
    td.pos{grid-row:span 2;align-self:center;width:auto;font-size:1.1rem}
    td.name{grid-column:2}
    td.date{grid-column:2;grid-row:2}
    td.sc{grid-column:3;grid-row:1 / span 2;align-self:center}
  }
</style>
</head>
<body>
<header>
  <div class="in">
    <img src="img/logo-colegio.jpeg" alt="">
    <div>
      <h1>Painel do Quiz</h1>
      <p>Curiosidades da Grécia · 9º ano Tarde</p>
    </div>
    <a href="index.html">← Voltar ao site</a>
  </div>
</header>

<main>
  <form class="login" id="login">
    <h2>Área dos administradores</h2>
    <p>Digite a senha para ver os participantes e suas pontuações.</p>
    <input type="password" id="pass" placeholder="Senha" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="msg" id="loginMsg"></p>
  </form>

  <div id="dash" hidden>
    <div class="stats">
      <div class="stat"><span>Participantes</span><strong id="sCount">0</strong></div>
      <div class="stat"><span>Média de acertos</span><strong id="sAvg">–</strong></div>
      <div class="stat"><span>Gabaritaram</span><strong id="sMax">0</strong></div>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar participante…">
      <div class="seg" role="group" aria-label="Ordenar">
        <button type="button" data-sort="rank" aria-pressed="true">Ranking</button>
        <button type="button" data-sort="recent" aria-pressed="false">Mais recentes</button>
      </div>
      <button class="btn light" type="button" id="refresh">↻ Atualizar</button>
      <button class="btn light" type="button" id="csv">⬇ Baixar CSV</button>
      <button class="btn light" type="button" id="logout">Sair</button>
    </div>
    <p class="updated" id="updated"></p>

    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Nome</th><th>Data/hora</th><th>Acertos</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>Ninguém jogou ainda.</p>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const API = window.QUIZ_API_URL;
  let senha = '', data = [], sortMode = 'rank', timer = null;

  const store = {
    get(){ try { return sessionStorage.getItem('quizAdmin') || ''; } catch { return ''; } },
    set(v){ try { v ? sessionStorage.setItem('quizAdmin', v) : sessionStorage.removeItem('quizAdmin'); } catch {} }
  };

  async function load(pass) {
    const res = await fetch(API + '?senha=' + encodeURIComponent(pass));
    return res.json();
  }

  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    if (!API) { $('loginMsg').textContent = 'O site ainda não foi ligado à planilha (config.js).'; return; }
    $('loginMsg').textContent = 'Verificando…';
    await tryLogin($('pass').value);
  });

  async function tryLogin(pass) {
    try {
      const r = await load(pass);
      if (!r.ok) { $('loginMsg').textContent = r.erro === 'senha' ? 'Senha incorreta.' : 'Erro: ' + r.erro; store.set(''); return; }
      senha = pass; store.set(pass);
      $('loginMsg').textContent = '';
      $('login').hidden = true; $('dash').hidden = false;
      setData(r.resultados);
      clearInterval(timer);
      timer = setInterval(refresh, 20000);
    } catch {
      $('loginMsg').textContent = 'Não foi possível conectar. Verifique a internet.';
    }
  }

  async function refresh() {
    try {
      const r = await load(senha);
      if (r.ok) setData(r.resultados);
    } catch { $('updated').textContent = 'Falha ao atualizar. Tentando de novo em instantes…'; }
  }

  function setData(list) {
    data = list.map(x => ({ ...x, t: new Date(x.data) }));
    $('updated').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR') + ' · atualiza sozinho a cada 20 s';
    render();
  }

  function rankSorted() {
    return [...data].sort((a, b) => (b.acertos / b.total) - (a.acertos / a.total) || a.t - b.t);
  }

  function render() {
    const n = data.length;
    $('sCount').textContent = n;
    $('sAvg').textContent = n ? (data.reduce((s, x) => s + x.acertos, 0) / n).toFixed(1).replace('.', ',') : '–';
    $('sMax').textContent = data.filter(x => x.acertos === x.total).length;

    const ranked = rankSorted();
    const pos = new Map(ranked.map((x, i) => [x, i + 1]));
    let list = sortMode === 'rank' ? ranked : [...data].sort((a, b) => b.t - a.t);
    const q = $('search').value.trim().toLowerCase();
    if (q) list = list.filter(x => x.nome.toLowerCase().includes(q));

    const tbody = $('rows');
    tbody.replaceChildren();
    const medals = ['🥇', '🥈', '🥉'];
    list.forEach(x => {
      const tr = document.createElement('tr');
      const p = pos.get(x);
      const cells = [
        ['pos', p <= 3 ? medals[p - 1] : p + 'º'],
        ['name', x.nome],
        ['date', isNaN(x.t) ? x.data : x.t.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })],
      ];
      cells.forEach(([c, v]) => { const td = document.createElement('td'); td.className = c; td.textContent = v; tr.appendChild(td); });
      const td = document.createElement('td'); td.className = 'sc';
      const s = document.createElement('span');
      s.className = 'score' + (x.acertos === x.total ? ' max' : '');
      s.textContent = `${x.acertos}/${x.total}`;
      td.appendChild(s); tr.appendChild(td);
      tbody.appendChild(tr);
    });
    $('empty').hidden = list.length > 0;
    $('empty').textContent = n ? 'Nenhum participante encontrado.' : 'Ninguém jogou ainda.';
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    sortMode = b.dataset.sort;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  }));
  $('search').addEventListener('input', render);
  $('refresh').addEventListener('click', refresh);
  $('logout').addEventListener('click', () => {
    store.set(''); senha = ''; clearInterval(timer);
    $('dash').hidden = true; $('login').hidden = false; $('pass').value = '';
  });
  $('csv').addEventListener('click', () => {
    const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['Posição', 'Nome', 'Data/hora', 'Acertos', 'Total'].map(esc).join(';')];
    rankSorted().forEach((x, i) => lines.push([i + 1, x.nome, x.t.toLocaleString('pt-BR'), x.acertos, x.total].map(esc).join(';')));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'resultados-quiz-grecia.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  const saved = store.get();
  if (saved && API) tryLogin(saved);
})();
</script>
</body>
</html>
